name: Hesap genelinde D1 okuma koruması
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: read
concurrency:
  group: d1-account-quota-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Yalnız hesap analitiği ve tek kota kaydı; geçmiş veri sorgusu yok
        id: usage
        run: python3 scripts/d1_quota_checkpoint.py --require-live-guard
      - name: Kayıtlı gerçek Cron sonucunu ve okuma maliyetini doğrula; aktarım başlatmaz
        if: steps.usage.outputs.ready == 'true'
        run: python3 scripts/d1_read_acceptance.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: d1-quota-checkpoint-${{ github.run_id }}
          path: |
            .local/d1-quota-checkpoint.json
            .local/d1-read-acceptance.json
          retention-days: 2
          if-no-files-found: warn
