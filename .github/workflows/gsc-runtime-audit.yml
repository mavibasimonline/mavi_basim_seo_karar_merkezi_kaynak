name: Özel günlük GSC çalışma kanıtı
on:
  workflow_run:
    workflows: [Test ve kabul denetimi]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: gsc-runtime-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tam başarılı main CI ve tek seferlik tanılama kaydı
        id: guard
        env:
          VERIFIED_CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$VERIFIED_CI_SHA" != "$(git rev-parse HEAD)" ]; then exit 0; fi
          if [ "$(git log -1 --format=%s)" != 'audit: daily GSC runtime evidence 20261104' ]; then exit 0; fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: '24'
      - if: steps.guard.outputs.ready == 'true'
        run: npm ci --ignore-scripts --no-fund
      - name: Hesaba özel önizlemeyle salt okunur GSC kapsamı — üretim yayını yok
        if: steps.guard.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/gsc_runtime_audit.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.guard.outputs.ready == 'true'
        with:
          name: gsc-runtime-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/gsc-runtime-audit/evidence.json
          retention-days: 7
          if-no-files-found: error
