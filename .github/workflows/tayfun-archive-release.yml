name: Tayfun özel arşiv Worker yayını
on:
  workflow_run:
    workflows: ["Test ve kabul denetimi"]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: mavi-production-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERIFIED_CI_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact successful main CI source and Tayfun-only release trigger
        id: gate
        run: |
          set -euo pipefail
          test "$VERIFIED_CI_SHA" = "$(git rev-parse HEAD)" || exit 0
          test "$(git log -1 --format=%s)" = "fix: release Tayfun private archive backend" || exit 0
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-fund
        if: steps.gate.outputs.ready == 'true'
      - name: Verify frozen archive bindings, free plan and unchanged main Worker
        if: steps.gate.outputs.ready == 'true'
        run: python3 scripts/tayfun_archive_release.py preflight
      - name: Deploy private archive only; preserve existing secrets and SQLite
        id: publish
        if: steps.gate.outputs.ready == 'true'
        run: |
          node scripts/run.mjs wrangler deploy --config deploy/wrangler.drive-archive.jsonc --keep-vars --tag "$VERIFIED_CI_SHA" --message "Tayfun private archive API only"
      - name: Confirm archive version, secret bindings, main Worker and schedules
        if: steps.gate.outputs.ready == 'true'
        run: python3 scripts/tayfun_archive_release.py postflight
      - name: Restore previous private archive on failed postflight
        if: failure() && steps.publish.outcome == 'success'
        run: |
          python3 scripts/tayfun_archive_release.py rollback
