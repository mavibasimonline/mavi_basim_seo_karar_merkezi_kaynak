name: D1 kullanmayan bağımsız Drive kurulumu
on:
  workflow_dispatch:
    inputs:
      previous_version:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: mavi-production-deployment
  cancel-in-progress: false
jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      EXPECTED_PREVIOUS_VERSION: ${{ inputs.previous_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-fund
      - name: Tam CI, ücretsiz SQLite deposu, yalnız izole kaynak, sıfır D1 isteği
        run: python3 scripts/independent_drive_release.py
