name: Kontrollü üretim yayını
on:
  workflow_dispatch:
    inputs:
      previous_version:
        description: Tanılamada doğrulanan mevcut Worker version UUID
        required: true
        type: string
      source_commit:
        description: Optional pinned reviewed source; live UI and exact source CI must match
        type: string
  schedule:
    - cron: '17,47 0-2 26 10 *' # One-time recovery window; script rejects any date except 2026-10-26.
permissions:
  contents: read
  actions: read
concurrency:
  group: mavi-production-deployment
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      needed: ${{ steps.ready.outputs.needed }}
      previous_version: ${{ steps.ready.outputs.previous_version }}
      source_commit: ${{ steps.ready.outputs.source_commit }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      EXPECTED_PREVIOUS_VERSION: ${{ inputs.previous_version }}
      RELEASE_SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: D1 okumadan yenilenme tarihi, tam main CI ve gerçek sürümü kontrol et
        id: ready
        run: python3 scripts/release_readiness.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-readiness-${{ github.run_id }}
          path: .local/release-readiness.json
          retention-days: 3
          if-no-files-found: ignore
  deploy:
    needs: prepare
    if: github.ref_name == 'main' && needs.prepare.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - name: Stage only the verified source; keep trusted deployment guards on main
        run: python3 scripts/scoped_release.py stage
      - name: Canlı sürümü ve korunan ayarları doğrula
        id: guard
        env:
          EXPECTED_PREVIOUS_VERSION: ${{ needs.prepare.outputs.previous_version }}
        run: python3 scripts/production_guard.py preflight
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-rollback-${{ github.run_id }}
          path: .local/production-before.json
          retention-days: 7
      - name: Kaynak ve bağımsız Worker hedefini doğrula
        run: python3 scripts/release_checks.py --base HEAD
      - name: Mevcut şemayı salt okunur doğrula ve kota iznini yenile
        run: |
          python3 -c "from datetime import datetime,timezone; from pathlib import Path; import sys; sys.path.insert(0,'scripts'); from d1_quota_checkpoint import NOT_BEFORE; assert datetime.now(timezone.utc)>=NOT_BEFORE, 'WAIT_FOR_UTC_QUOTA_RESET'"
          python3 scripts/production_guard.py verify-schema
          python3 scripts/d1_quota_checkpoint.py
      - name: PR30 doğal UTC gün geçişi ve kullanıcı payını salt okunur doğrula
        if: needs.prepare.outputs.source_commit == 'f888618954a49f0117ac1dfbd1d43ea80393a03b'
        run: python3 scripts/pr30_rollover_gate.py
      - name: Aynı Worker'a, mevcut secret ve D1 binding'lerini koruyarak yayımla
        id: publish
        run: |
          cd "$RELEASE_SOURCE_DIR"
          node "$GITHUB_WORKSPACE/scripts/run.mjs" wrangler deploy --config deploy/wrangler.production.jsonc --keep-vars --var D1_READ_GUARD_ENABLED:true --var SYNC_MAX_PAGES_PER_TICK:1 --tag "$RELEASE_SOURCE_COMMIT" --message "Reviewed source $RELEASE_SOURCE_COMMIT via main $GITHUB_SHA"
      - name: Gerçek HTTP yanıtında tam commit'i doğrula
        id: smoke
        run: |
          python3 scripts/production_guard.py smoke
          if [ "$RELEASE_SOURCE_COMMIT" != "$GITHUB_SHA" ]; then
            python3 scripts/scoped_release.py assets
            python3 scripts/mapping_canary.py
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mapping-canary-${{ github.run_id }}
          path: .local/mapping-canary/result.json
          retention-days: 2
          if-no-files-found: ignore
      - name: Yeni yayın doğrulanmazsa Cron’u tut ve önceki Worker sürümüne dön
        if: failure() && steps.publish.outcome == 'success' && steps.smoke.outcome != 'success'
        env:
          PREVIOUS_VERSION: ${{ steps.guard.outputs.previous_version }}
        run: |
          if [ "$RELEASE_SOURCE_COMMIT" != "f888618954a49f0117ac1dfbd1d43ea80393a03b" ]; then
            python3 scripts/production_guard.py pause-cron
          fi
          node scripts/run.mjs wrangler rollback "$PREVIOUS_VERSION" --config deploy/wrangler.production.jsonc --message "Automatic rollback after failed release verification" --yes
          if [ "$RELEASE_SOURCE_COMMIT" != "f888618954a49f0117ac1dfbd1d43ea80393a03b" ]; then
            python3 scripts/production_guard.py pause-cron
          fi
          if [ "$RELEASE_SOURCE_COMMIT" = "f888618954a49f0117ac1dfbd1d43ea80393a03b" ]; then
            python3 scripts/pr30_rollover_gate.py --verify-rollback-cron
          fi
