name: Kontrollü üretim yayını
on:
  workflow_dispatch:
    inputs:
      previous_version:
        description: Tanılamada doğrulanan mevcut Worker version UUID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mavi-production-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - name: Canlı sürümü ve korunan ayarları doğrula
        id: guard
        env:
          EXPECTED_PREVIOUS_VERSION: ${{ inputs.previous_version }}
        run: python3 scripts/production_guard.py preflight
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-rollback-${{ github.run_id }}
          path: .local/production-before.json
          retention-days: 7
      - name: Kaynak ve bağımsız Worker hedefini doğrula
        run: python3 scripts/release_checks.py --base HEAD
      - name: Kota yenilenmeden migration veya yeni aktarım başlatma
        run: |
          python3 -c "from datetime import datetime,timezone; from pathlib import Path; import sys; sys.path.insert(0,'scripts'); from d1_quota_checkpoint import NOT_BEFORE; assert datetime.now(timezone.utc)>=NOT_BEFORE, 'WAIT_FOR_UTC_QUOTA_RESET'"
          node scripts/run.mjs wrangler d1 migrations apply DB --remote --config deploy/wrangler.production.jsonc
          python3 scripts/d1_quota_checkpoint.py
      - name: Aynı Worker'a, mevcut secret ve D1 binding'lerini koruyarak yayımla
        id: publish
        run: node scripts/run.mjs wrangler deploy --config deploy/wrangler.production.jsonc --keep-vars --var D1_READ_GUARD_ENABLED:true --var SYNC_MAX_PAGES_PER_TICK:1 --tag "$GITHUB_SHA" --message "GSC queue $GITHUB_SHA"
      - name: Gerçek HTTP yanıtında tam commit'i doğrula
        id: smoke
        run: python3 scripts/production_guard.py smoke
      - name: Yeni yayın doğrulanmazsa önceki Cron ve Worker sürümüne dön
        if: failure() && steps.publish.outcome == 'success' && steps.smoke.outcome != 'success'
        env:
          PREVIOUS_VERSION: ${{ steps.guard.outputs.previous_version }}
        run: |
          python3 scripts/production_guard.py restore-cron
          node scripts/run.mjs wrangler rollback "$PREVIOUS_VERSION" --config deploy/wrangler.production.jsonc --message "Automatic rollback after failed release verification" --yes
