name: Şifreli D1 yedek ve geri yükleme denetimi
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Salt okunur tanılama veya mevcut şifreli yedek
        type: choice
        default: backup
        options: [backup, diagnose, crawl-pilot, frontend-check, product-crawl, quota-inspect, quota-contain, quota-builds, gsc-row-inspect, gsc-row-requeue, gsc-progress-inspect]
  schedule:
    - cron: '17 2 * * *'
    - cron: '7 0 * * *' # 03:07 Turkey: read-only rollover evidence, may be delayed by GitHub
permissions:
  contents: read
concurrency:
  group: d1-backup
  cancel-in-progress: false
jobs:
  backup:
    # First restoration is an explicit manual run; scheduled backups require a separate opt-in.
    if: (github.event_name == 'workflow_dispatch' && (inputs.operation == 'backup' || inputs.operation == '')) || (github.event_name == 'schedule' && github.event.schedule == '17 2 * * *' && vars.PRODUCTION_BACKUPS_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Erişim ön koşulları
        id: access
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$BACKUP_ENCRYPTION_KEY" ] && ! rg -q '00000000-0000-0000-0000-000000000000' deploy/wrangler.production.jsonc; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Gerçek D1 kimliği veya yedekleme kimlik bilgileri yok; gerçek yedek alınmadı.'
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.access.outputs.ready == 'true'
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.access.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - if: steps.access.outputs.ready == 'true'
        run: npm ci --ignore-scripts --no-fund
      - name: Dışa aktar, şifrele ve ayrı veritabanında geri yükle
        if: steps.access.outputs.ready == 'true'
        run: |
          node scripts/run.mjs wrangler d1 export DB --remote --config deploy/wrangler.production.jsonc --output .local/backup.sql
          node scripts/backup.mjs encrypt .local/backup.sql .local/backup.mavi > .local/backup-manifest.json
          node scripts/backup.mjs decrypt .local/backup.mavi .local/verified.sql
          cmp .local/backup.sql .local/verified.sql
          python3 scripts/verify_restore.py --sql .local/verified.sql
      - name: Yalnızca şifreli yedek sakla
        if: steps.access.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mavi-seo-encrypted-${{ github.run_id }}
          path: |
            .local/backup.mavi
            .local/backup-manifest.json
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Açık veriyi temizle
        if: always()
        run: rm -f .local/backup.sql .local/verified.sql

  diagnose:
    if: (github.event_name == 'workflow_dispatch' && inputs.operation == 'diagnose') || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Salt okunur üretim tanılaması — secret veya ham sorgu çıktısı yok
        run: python3 scripts/cloudflare_diagnostics.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-diagnostics-${{ github.run_id }}
          path: .local/production-diagnostics.json
          retention-days: 3
          if-no-files-found: error

  crawl-pilot:
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'crawl-pilot' || inputs.operation == 'frontend-check' || inputs.operation == 'product-crawl')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run typecheck
      - name: Mevcut tarayıcıyla en fazla 12 gerçek salt okunur site sayfası
        if: inputs.operation == 'crawl-pilot'
        run: python3 scripts/crawl_pilot.py --max-pages 12
      - name: Mevcut tarayıcıyla 29 ürün kabulünü en fazla 12 istekle ilerlet
        if: inputs.operation == 'product-crawl'
        run: python3 scripts/crawl_pilot.py --all-products --max-pages 12
      - name: Gerçek D1 verileriyle grafik ve sorgu API kontrolü — yalnız sayım ve boolean çıktısı
        if: inputs.operation == 'frontend-check'
        run: python3 scripts/crawl_pilot.py --performance-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: real-crawl-pilot-${{ github.run_id }}
          path: .local/crawl-pilot-summary.json
          retention-days: 3
          if-no-files-found: warn

  quota-incident:
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'quota-inspect' || inputs.operation == 'quota-contain' || inputs.operation == 'quota-builds')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUOTA_OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: D1 okumadan hesap analitiği ve güvenli Cron sınırı
        run: python3 scripts/d1_quota_control.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d1-quota-incident-${{ github.run_id }}
          path: .local/d1-quota-incident.json
          retention-days: 3
          if-no-files-found: error

  gsc-row-recovery:
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'gsc-row-inspect' || inputs.operation == 'gsc-row-requeue')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Yalnız iki eski hata; kota ve tam canlı commit zorunlu, aktarım başlatmaz
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          if [ "$OPERATION" = 'gsc-row-requeue' ]; then
            python3 scripts/gsc_row_recovery.py requeue
          else
            python3 scripts/gsc_row_recovery.py inspect
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gsc-row-recovery-${{ github.run_id }}
          path: .local/gsc-row-recovery.json
          retention-days: 3
          if-no-files-found: warn

  gsc-progress-inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'gsc-progress-inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Salt okunur denetim sınırlarını yerelde test et
        run: python3 -m unittest discover -s tests -p 'test_gsc_continuity_audit.py' -v
      - name: Mevcut kapsam ve Eylül metriklerini yalnız SELECT ile denetle
        run: python3 scripts/gsc_continuity_audit.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gsc-continuity-audit-${{ github.run_id }}
          path: .local/gsc-continuity-audit.json
          retention-days: 3
          if-no-files-found: warn
