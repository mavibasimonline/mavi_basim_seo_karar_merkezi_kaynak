name: Salt okunur Drive HTTP kabul tanısı
on:
  workflow_dispatch:
    inputs:
      operation:
        type: string
        default: diagnose
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 scripts/drive_owner_probe.py
