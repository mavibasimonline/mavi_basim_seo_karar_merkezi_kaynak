name: Bağımsız Cloudflare kota gözlemcisi
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [inspect, deploy]
        default: inspect
      previous_observer_version:
        type: string
        description: Exact reviewed failed observer version; required to resume a stopped observer
permissions:
  contents: read
  actions: read
concurrency:
  group: independent-quota-observer-release
  cancel-in-progress: false
jobs:
  inspect:
    if: inputs.operation == 'inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_QUOTA_ANALYTICS_TOKEN: ${{ secrets.CF_QUOTA_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 scripts/quota_observer_release.py inspect
  deploy:
    if: inputs.operation == 'deploy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_QUOTA_ANALYTICS_TOKEN: ${{ secrets.CF_QUOTA_ANALYTICS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EXPECTED_STOPPED_OBSERVER_VERSION: ${{ inputs.previous_observer_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-fund
      - name: Yalnız ayrı gözlemci — CI, ücretsiz plan, dar kimlik ve canlı sürüm kilidi
        run: python3 scripts/quota_observer_release.py deploy
