name: Test ve kabul denetimi
on:
  push:
    branches: [main, feat/seo-karar-merkezi]
    paths-ignore: ['**/*.csv', '**/*.md']
  pull_request:
    paths-ignore: ['**/*.csv', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-fund
      - run: npm run check
      - run: python3 scripts/local_secrets.py
      - run: npm run db:migrate
      - run: npm run data:import
      - run: npm run test:e2e
      - name: Kaynak CSV dosyaları değişmedi
        run: git diff --exit-code -- '*.csv'
