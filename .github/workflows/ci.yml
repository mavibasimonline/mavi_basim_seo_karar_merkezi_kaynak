name: Test ve kabul denetimi
on:
  push:
    branches: [main, feat/seo-karar-merkezi]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --audit-level=moderate
      - name: Kaynak, gizli değer ve üretim yapılandırması denetimi
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: python3 scripts/release_checks.py --base "$RELEASE_BASE"
      - run: npm run check
      - run: python3 scripts/local_secrets.py
      - run: npm run db:migrate
      - run: npm run data:import
      - run: npm run test:e2e
      - name: Üretim paketi denetimi — dağıtım yapmaz
        run: node scripts/run.mjs wrangler deploy --dry-run --config deploy/wrangler.production.jsonc --outdir .local/production-build
      - name: Kaynak CSV dosyaları değişmedi
        run: git diff --exit-code -- '*.csv'
