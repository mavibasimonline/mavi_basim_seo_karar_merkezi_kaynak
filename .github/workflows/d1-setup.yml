name: D1 kurulum denetimi ve kontrollü migration

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Sadece kontrol veya migration uygula"
        required: true
        type: choice
        default: verify
        options:
          - verify
          - migrate
      confirmation:
        description: "migrate icin aynen APPLY_MAVI_BASIM_D1 yazin; verify icin bos birakin"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: mavi-basim-d1-schema
  cancel-in-progress: false

jobs:
  d1-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Bağlam ve güvenlik kapısı
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          if os.environ['REPOSITORY'] != 'mavibasimonline/mavi_basim_seo_karar_merkezi_kaynak':
              raise SystemExit('UNEXPECTED_REPOSITORY')
          if os.environ['REF_NAME'] != 'main':
              raise SystemExit('MAIN_ONLY')
          operation = os.environ['OPERATION']
          if operation not in ('verify','migrate'):
              raise SystemExit('INVALID_OPERATION')
          if operation == 'migrate' and os.environ['CONFIRMATION'] != 'APPLY_MAVI_BASIM_D1':
              raise SystemExit('EXPLICIT_MIGRATION_CONFIRMATION_REQUIRED')
          c=json.loads(Path('deploy/wrangler.production.jsonc').read_text())
          db=c['d1_databases'][0]
          if db['binding'] != 'DB' or db['database_name'] != 'mavi-basim-seo' or db['database_id'] != '18f8c90d-4af1-430c-ac86-ddf184c75a0b':
              raise SystemExit('UNEXPECTED_D1_DATABASE')
          if c['name'] != 'mavi-basim-seo-prod' or c['vars']['AUTOMATION_ENABLED'] != 'false' or c['vars']['CRAWL_ENABLED'] != 'false' or c['triggers']['crons']:
              raise SystemExit('AUTOMATION_NOT_DISABLED')
          if c.get('routes') or c.get('route'):
              raise SystemExit('LIVE_SITE_ROUTE_FORBIDDEN')
          print('Repo, main, D1 kimligi ve kapali otomasyon kontrolleri gecti.')
          PY
      - name: Bağımlılıkları yükle
        run: npm ci --ignore-scripts --no-fund
      - name: Kodu doğrula ve şema paketleme kontrolü
        run: |
          python3 scripts/release_checks.py --base HEAD
          node scripts/run.mjs wrangler deploy --dry-run --config deploy/wrangler.production.jsonc --outdir .local/production-build
      - name: Cloudflare bağlantısını ve migration listesini denetle
        if: inputs.operation == 'migrate'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN_NOT_SET'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID_NOT_SET'; exit 1; }
          node scripts/run.mjs wrangler d1 migrations list DB --remote --config deploy/wrangler.production.jsonc
      - name: Yalnızca seçili D1 veritabanına migration uygula
        if: inputs.operation == 'migrate'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/run.mjs wrangler d1 migrations apply DB --remote --config deploy/wrangler.production.jsonc
      - name: Tamamlanan kurulumları doğrula
        if: inputs.operation == 'migrate'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/run.mjs wrangler d1 migrations list DB --remote --config deploy/wrangler.production.jsonc
