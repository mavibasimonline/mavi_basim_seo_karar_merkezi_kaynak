name: D1 ilk kurulum (tek seferlik)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-initial-setup-once.yml'

permissions:
  contents: read

concurrency:
  group: mavi-basim-initial-d1-setup
  cancel-in-progress: false

jobs:
  initial-schema:
    if: github.event.head_commit.message == 'ops(d1): one-time authorized initial schema setup'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Secret ve kurulum kimlik kapisi
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'TOKEN_MISSING'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'ACCOUNT_ID_MISSING'; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = "0625d95f2a6f531e22b905c619ba1de5" || { echo 'ACCOUNT_MISMATCH'; exit 1; }
          node - <<'JS'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('deploy/wrangler.production.jsonc','utf8'));
          const d=c.d1_databases;
          if(c.name!=='mavi-basim-seo-prod'||d.length!==1||d[0].binding!=='DB'||d[0].database_name!=='mavi-basim-seo'||d[0].database_id!=='18f8c90d-4af1-430c-ac86-ddf184c75a0b'||c.vars.AUTOMATION_ENABLED!=='false'||c.vars.CRAWL_ENABLED!=='false'||c.triggers.crons.length!==0||c.route||c.routes)process.exit(1);
          console.log('Güvenli kurulum kontrolü tamamlandı');
          JS
      - run: npm ci --ignore-scripts --no-fund
      - name: Uygulanacak migration dosyalarını denetle
        run: |
          test "$(ls migrations/[0-9]*.sql | wc -l)" -eq 4
          node scripts/run.mjs wrangler d1 migrations list DB --remote --config deploy/wrangler.production.jsonc
      - name: Kurulum tablolarını olustur
        run: node scripts/run.mjs wrangler d1 migrations apply DB --remote --config deploy/wrangler.production.jsonc
      - name: Kurulum kaydini denetle
        run: node scripts/run.mjs wrangler d1 migrations list DB --remote --config deploy/wrangler.production.jsonc
