name: Kontrollü D1 bağımsız SEO yayını
on:
  workflow_run:
    workflows: ["Test ve kabul denetimi"]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: mavi-production-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Sadece CI onaylı ve tek seferlik bağımsız sürüm
        id: gate
        env:
          VERIFIED_CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$VERIFIED_CI_SHA" != "$(git rev-parse HEAD)" ]; then exit 0; fi
          if [ "$(git log -1 --format=%s)" != 'release: verify independent SEO probe transport' ]; then exit 0; fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-fund
        if: steps.gate.outputs.ready == 'true'
      - name: Ücretsiz hesap, CI, mevcut Worker kilitleri ve D1 korumalı dağıtım
        if: steps.gate.outputs.ready == 'true'
        run: python3 scripts/independent_seo_release.py
