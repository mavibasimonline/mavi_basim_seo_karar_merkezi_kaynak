name: Tayfun otomatik SEO paneli kontrollü ana Worker yayını
on:
  workflow_run:
    workflows: ["Test ve kabul denetimi"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  statuses: write
concurrency:
  group: tayfun-verified-main-release-20261106
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERIFIED_CI_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
      RELEASE_SOURCE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
      - name: Require successful push CI for the exact manual release SHA
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.parse,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          sha=os.environ['VERIFIED_CI_SHA']
          query=urllib.parse.urlencode({'head_sha':sha,'event':'push','per_page':30})
          url=f'https://api.github.com/repos/{repo}/actions/workflows/ci.yml/runs?{query}'
          for attempt in range(31):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=25) as response:data=json.load(response)
              runs=[run for run in data.get('workflow_runs',[])
                    if run.get('head_sha')==sha and run.get('head_branch')=='main']
              if any(run.get('conclusion')=='success' and run.get('status')=='completed' for run in runs):
                  print('Verified successful push CI for exact production source SHA')
                  break
              if runs and all(run.get('status')=='completed' for run in runs):
                  raise SystemExit('CI_FOR_EXACT_SHA_FINISHED_WITHOUT_SUCCESS: '+','.join(
                      str(run.get('conclusion')) for run in runs))
              if attempt==30:
                  raise SystemExit('CI_FOR_EXACT_SHA_NOT_SUCCESSFUL_AFTER_BOUNDED_WAIT')
              print('Waiting for exact SHA CI completion; attempt',attempt+1,flush=True)
              time.sleep(20)
          PY
      - name: Exact CI and single reviewed Tayfun release
        id: gate
        run: |
          set -euo pipefail
          test "$VERIFIED_CI_SHA" = "$(git rev-parse HEAD)" || exit 0
          # Never deploy an older CI result over newer main: pin the tested SHA and require it is still HEAD of main.
          test "$VERIFIED_CI_SHA" = "$(git rev-parse refs/remotes/origin/main)" || exit 0
          title="$(git log -1 --format=%s)"
          if [ "$title" = "fix(ga4): activate existing analytics property in protected production" ]; then echo "ga4=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$title" = "fix(ga4): activate existing analytics property in protected production" ] || [ "$title" = "fix(ga4): automatic bounded retry for transient source failures" ] || [ "$title" = "fix(ga4): run independent analytics cron without GSC starvation" ] || [ "$title" = "fix(tayfun): recover missed daily evidence-context archive refresh" ] || [ "$title" = "fix(tayfun): distinguish bounded SEO summary from immutable complete history" ] || [ "$title" = "fix(gsc): distinguish future days from overdue monthly data" ] || [ "$title" = "fix(release): scope GA4 transition permission to activation only" ] || [ "$title" = "fix(gsc): preserve actual collector outcome instead of success" ] || [ "$title" = "fix(gsc): isolate daily collection from slow Sheets and baseline tasks" ] || [ "$title" = "fix(gsc): sequence historical catch-up after independent daily collector" ] || [ "$title" = "fix(tayfun): isolate robots-aware crawl from historical SEO queue" ] || [ "$title" = "fix(ga4): distinguish verified empty report from missing monthly archive" ] || [ "$title" = "fix(release): deploy only tested latest main commit" ] || [ "$title" = "fix(gsc): reject unknown historical collector states" ] || [ "$title" = "fix(ga4): require matching date ranges across all archived report dimensions" ] || [ "$title" = "fix(ga4): suppress mismatched monthly metrics and use verified total sessions" ] || [ "$title" = "fix(tayfun): decouple metered immutable SEO history transfer from slow background queue" ] || [ "$title" = "fix(ga4): explain incomplete date-consistent archive in city answers" ] || [ "$title" = "fix(ga4): gate all metric breakdowns on consistent archive dates" ] || [ "$title" = "fix(tayfun): show active Cloudflare Worker commit in data health" ] || [ "$title" = "fix(release): publish successful Cloudflare smoke as commit status" ] || [ "$title" = "fix(tayfun): isolate approved baseline capture from legacy scheduling" ] || [ "$title" = "fix(release): record pending and failed deployment outcomes" ] || [ "$title" = "test(ga4): enforce complete-month evidence and verified empty archive behavior" ] || [ "$title" = "fix(scheduler): keep GSC daily tick independent of Sheets and Planner latency" ] || [ "$title" = "fix(ga4): block stale current-month archive until latest eligible day" ] || [ "$title" = "fix(tayfun): verify immutable SEO history archive acknowledgement" ] || [ "$title" = "feat(tayfun): answer manual GSC GA4 questions from local immutable evidence" ] || [ "$title" = "fix(tayfun): place manual GSC GA4 import at top of workspace" ] || [ "$title" = "fix(tayfun): add prominent one-click GSC GA4 upload button" ] || [ "$title" = "fix(release): allow CI-pinned manual retry of Cloudflare production" ] || [ "$title" = "fix(release): wait for exact successful CI before manual publish" ] || [ "$title" = "fix(ga4): narrow tick result before reading provider error code" ] || [ "$title" = "test(tayfun): verify hourly missed evidence archive catch-up" ] || [ "$title" = "fix(tayfun): wire compact upload button to private file picker" ] || [ "$title" = "test(tayfun): verify visible upload success and persistence after reload" ] || [ "$title" = "test(layout): validate shared toolbar and local storage toast" ] || [ "$title" = "fix(layout): move toolbar controller into existing SEO module" ] || [ "$title" = "fix(layout): load global reporting styles via existing shared CSS" ] || [ "$title" = "test(layout): validate report actions through compact topbar menu" ] || [ "$title" = "fix(layout): preserve all 12 visible desktop months beside shared reports" ] || [ "$title" = "fix(layout): anchor report menu over avatar without consuming desktop month width" ] || [ "$title" = "fix(layout): fit twelve readable months at 1280px without removing reports" ] || [ "$title" = "test(layout): verify removed topbar indicators preserve data health checks" ]; then echo "safe_release=true" >> "$GITHUB_OUTPUT"; elif [ "$title" != "Tayfun: sitemap sayfalarının aylık otomatik SEO arşivi ve sürüm karşılaştırması (#93)" ] && [ "$title" != "fix(tayfun): publish verified main Worker after archive release" ]; then exit 0; fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Mark reviewed production release as pending
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          body={'state':'pending','context':'mavi-basim-seo/cloudflare-production',
                'description':'Verified CI passed; Cloudflare production checks pending',
                'target_url':f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
          url=f"https://api.github.com/repos/{repo}/statuses/{os.environ['VERIFIED_CI_SHA']}"
          request=urllib.request.Request(url,data=json.dumps(body).encode(),method='POST',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
                       'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request,timeout=20) as result:
              if result.status!=201:raise ValueError('RELEASE_PENDING_STATUS_FAILED')
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-fund
        if: steps.gate.outputs.ready == 'true'
      - run: npm audit --audit-level=moderate
        if: steps.gate.outputs.ready == 'true'
      - run: npm run check
        if: steps.gate.outputs.ready == 'true'
      - name: Read-only active Worker version, free plan, and unchanged bindings
        id: version
        if: steps.gate.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          import os,sys
          sys.path.insert(0,'scripts')
          from cloudflare_diagnostics import Cloudflare
          from quota_observer_release import api,active_version,free_plan
          client=Cloudflare(os.environ['CLOUDFLARE_API_TOKEN'],os.environ['CLOUDFLARE_ACCOUNT_ID'])
          free_plan(api(client,'GET','/subscriptions'))
          version=active_version(api(client,'GET','/workers/scripts/mavi-basim-seo-prod/deployments'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('previous_version='+version+'\n')
          print('Read-only production version pinned')
          PY
      - name: Confirm private Tayfun archive already holds verified matching source
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.safe_release != 'true'
        run: |
          python3 - <<'PY'
          import os,sys
          sys.path.insert(0,'scripts')
          from cloudflare_diagnostics import Cloudflare
          from quota_observer_release import api,active_version
          client=Cloudflare(os.environ['CLOUDFLARE_API_TOKEN'],os.environ['CLOUDFLARE_ACCOUNT_ID'])
          base='/workers/scripts/mavi-basim-drive-archive'
          v=active_version(api(client,'GET',base+'/deployments'))
          record=api(client,'GET',base+'/versions/'+v)
          assert record.get('annotations',{}).get('workers/tag')=='434180a51f7a52d56b5145ade6c0df0168fcf974','TAYFUN_VERIFIED_ARCHIVE_REQUIRED'
          print('Private archive source and current version verified')
          PY
      - name: Preflight old version, source counts, D1 quota and immutable configuration
        if: steps.gate.outputs.ready == 'true'
        env:
          EXPECTED_PREVIOUS_VERSION: ${{ steps.version.outputs.previous_version }}
          ALLOW_GA4_PROPERTY_ACTIVATION: ${{ steps.gate.outputs.ga4 == 'true' && '532525867' || '' }}
        run: |
          python3 scripts/production_guard.py preflight
          python3 scripts/release_checks.py --base HEAD
          python3 scripts/production_guard.py verify-schema
          python3 scripts/d1_quota_checkpoint.py
      - name: Deploy only reviewed app code, preserving tokens, D1 and service bindings
        id: publish
        if: steps.gate.outputs.ready == 'true'
        run: |
          node scripts/run.mjs wrangler deploy --config deploy/wrangler.production.jsonc --keep-vars --var D1_READ_GUARD_ENABLED:true --var SYNC_MAX_PAGES_PER_TICK:1 --var GA4_PROPERTY_ID:532525867 --tag "$VERIFIED_CI_SHA" --message "Tayfun auto crawl reviewed source $VERIFIED_CI_SHA"
      - name: Verify exact live commit, 100% Worker version and safety guards
        if: steps.gate.outputs.ready == 'true'
        run: python3 scripts/production_guard.py smoke
      - name: Record verified Cloudflare release on the exact tested GitHub commit
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          commit=os.environ['VERIFIED_CI_SHA']
          repo=os.environ['GITHUB_REPOSITORY']
          url=f'https://api.github.com/repos/{repo}/statuses/{commit}'
          payload={
            'state':'success',
            'context':'mavi-basim-seo/cloudflare-production',
            'description':'Production smoke verified this exact Worker commit',
            'target_url':f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'Accept':'application/vnd.github+json',
            'Content-Type':'application/json',
            'X-GitHub-Api-Version':'2022-11-28'},method='POST')
          with urllib.request.urlopen(req,timeout=20) as response:
            if response.status!=201:raise ValueError('GITHUB_DEPLOY_STATUS_NOT_SAVED')
          print('Verified production source commit status recorded')
          PY
      - name: Roll back app only if this exact deployment fails after publishing
        if: failure() && steps.publish.outcome == 'success'
        env:
          PREVIOUS_VERSION: ${{ steps.version.outputs.previous_version }}
        run: |
          node scripts/run.mjs wrangler rollback "$PREVIOUS_VERSION" --config deploy/wrangler.production.jsonc --message "Rollback incomplete Tayfun auto release" --yes
      - name: Record rejected or failed Cloudflare deployment
        if: failure() && steps.gate.outputs.ready == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          body={'state':'failure','context':'mavi-basim-seo/cloudflare-production',
                'description':'Production deployment or verification failed; inspect run and rollback',
                'target_url':f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
          url=f"https://api.github.com/repos/{repo}/statuses/{os.environ['VERIFIED_CI_SHA']}"
          request=urllib.request.Request(url,data=json.dumps(body).encode(),method='POST',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
                       'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request,timeout=20) as result:
              if result.status!=201:raise ValueError('RELEASE_FAILED_STATUS_NOT_SAVED')
          PY
