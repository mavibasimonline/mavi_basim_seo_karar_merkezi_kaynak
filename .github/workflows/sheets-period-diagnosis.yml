name: Diagnose public Sheets period coverage
on:
  pull_request:
    paths:
      - '.github/workflows/sheets-period-diagnosis.yml'
      - 'scripts/diagnose_sheets_periods.py'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read public Sheets only, report grouped period counts
        run: python3 scripts/diagnose_sheets_periods.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-fund
      - name: Verify actual SQLite DO report from public Sheets without deployment
        run: python3 scripts/independent_real_data_acceptance.py
